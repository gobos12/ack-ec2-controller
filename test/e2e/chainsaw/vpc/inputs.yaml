# Values for the generated VPC test that the VPC's model can't supply.
create:
  cidrBlocks: [10.0.0.0/16, 10.2.0.0/16]
  instanceTenancy: default
  enableDNSSupport: true
  enableDNSHostnames: true
  enableNetworkAddressUsageMetrics: true
  disallowSecurityGroupDefaultRules: false
  tags:
  - key: initialtagkey
    value: initialtagvalue
updates:
- cidrBlocks: [10.0.0.0/16]
  enableDNSSupport: false
  enableNetworkAddressUsageMetrics: false
  disallowSecurityGroupDefaultRules: true
  tags:
  - key: updatedtagkey
    value: updatedtagvalue
# A new secondary block: 10.2.0.0/16 may still be disassociating
- cidrBlocks: [10.0.0.0/16, 10.3.0.0/16]
  enableDNSHostnames: false
  disallowSecurityGroupDefaultRules: false
  tags: []
variants:
# Only matters at create, and with the other attributes left unset: a fully
# specified spec can hide how the controller handles unset ones.
- name: disallowed
  description: Default security group rules removed at create, with no other attributes set
  create:
    cidrBlocks: [10.0.0.0/16]
    disallowSecurityGroupDefaultRules: true
- name: dedicated
  description: Created with dedicated tenancy, which ModifyVpcTenancy can only change to default
  create:
    cidrBlocks: [10.0.0.0/16]
    instanceTenancy: dedicated
  updates:
  - instanceTenancy: default
invalid:
  spec:
    cidrBlocks: [InvalidValue]
  message: "InvalidParameterValue: Value (InvalidValue) for parameter cidrBlock is invalid. This is not a valid CIDR block."
# Fields the generator can't read back by itself
checks:
  # A custom field: the VPC's associated blocks, of all those it's had
  cidrBlocks:
    path: CidrBlockAssociationSet
    where: {CidrBlockState.State: associated}
    select: CidrBlock
    unordered: true
  # Handled by hooks: true removes the default security group's rules. False
  # doesn't put them back, so only true can be checked.
  disallowSecurityGroupDefaultRules:
    command: >-
      aws ec2 describe-security-groups
      --filters Name=vpc-id,Values=$AWS_ID Name=group-name,Values=default
      --query 'length(SecurityGroups[0].IpPermissions) == `0` && length(SecurityGroups[0].IpPermissionsEgress) == `0`'
    when: true

# Held back until the controller bugs the tests found are fixed, and the
# create-only fields are marked is_immutable in generator.yaml. Drop an entry
# to run it again.
skip:
  tests:
    vpc-disallowed: "unset DNS and NAU attributes are synced with no value, which AWS rejects, so the VPC never syncs (aws-controllers-k8s/community#3161)"
  updates:
    amazonProvidedIPv6CIDRBlock: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    instanceTenancy: "never updated: the diff is detected but ModifyVpcTenancy is never called (aws-controllers-k8s/community#3198)"
    ipv4IPAMPoolID: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    ipv4NetmaskLength: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    ipv6CIDRBlock: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    ipv6CIDRBlockNetworkBorderGroup: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    ipv6IPAMPoolID: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    ipv6NetmaskLength: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
    ipv6Pool: "create-only: AssociateVpcCidrBlock adds another block but can't change this one, so it should be marked is_immutable"
